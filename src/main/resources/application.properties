quarkus.http.port=8081

quarkus.mailer.host=${SMTP_HOST}
quarkus.mailer.port=${SMTP_PORT}
quarkus.mailer.from=${SMTP_FROM}
quarkus.mailer.username=${SMTP_USERNAME}
quarkus.mailer.password=${SMTP_PASSWORD}
quarkus.mailer.start-tls=${SMTP_START_TLS}
quarkus.mailer.mock=${MAILER_MOCK}
quarkus.mailer.auth-methods=LOGIN

quarkus.log.category."io.vertx.ext.mail".level=DEBUG

quarkus.http.limits.max-body-size=10M

notification.attachments.max-size-bytes=5242880

mp.openapi.extensions.smallrye.info.title=Enterprise Notification Service
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=API para la gestión y envío de notificaciones a través de múltiples canales de comunicación.

%test.quarkus.mailer.mock=true

